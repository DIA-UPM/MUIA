# Builds the site from data/*.json and publishes dist/ to GitHub Pages.
#
# Runs on every push to main (and manually from the Actions tab).
# The public URL is detected automatically: https://<user>.github.io/<repo>/,
# or the custom domain once one is configured in Settings → Pages.
#
# Optional repository variables (Settings → Secrets and variables → Actions → Variables):
#   SITE_URL      force the public URL (e.g. https://muia.dia.fi.upm.es)
#   SITE_NOINDEX  "1" = ask search engines not to index this copy (temporary deployments)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
          SITE_NOINDEX: ${{ vars.SITE_NOINDEX }}
      - name: Check links and assets
        run: npm run check-links
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
